<!DOCTYPE html>
<html>
<head>
    <title>PDF Upload Center</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .upload-box { border: 2px dashed #ccc; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>PDF URL Generator</h1>
    <div class="upload-box">
        <p>ここにPDFを置いてURLを発行したい（開発中）</p>
        <input type="file" accept="application/pdf">
        <button onclick="alert('ここから先はサーバーの知識が必要だよ！')">アップロード</button>
    </div>
</body>
</html>
