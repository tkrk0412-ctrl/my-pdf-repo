<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Storage & History</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; width: 90%; max-width: 500px; }
        input[type="file"] { margin: 20px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        #result { margin: 20px 0; padding: 10px; border-radius: 5px; }
        .history-section { margin-top: 30px; text-align: left; border-top: 2px solid #eee; padding-top: 20px; }
        .history-list { list-style: none; padding: 0; font-size: 14px; }
        .history-item { background: #fff; margin-bottom: 5px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .history-item a { color: #007bff; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF保管庫</h1>
        <input type="file" id="fileInput" accept="application/pdf">
        <button onclick="uploadPDF()">アップロードしてURL発行</button>
        <div id="result"></div>

        <div class="history-section">
            <h3>📂 アップロード履歴</h3>
            <ul id="historyList" class="history-list">
                <li>読み込み中...</li>
            </ul>
        </div>
    </div>

    <script>
        const repo = "tkrk0412-ctrl/my-pdf-repo";

        // ページを開いた時にGitHubからファイル一覧を取得して履歴を作る
        async function loadHistory() {
            const listEl = document.getElementById('historyList');
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/`);
                const files = await response.json();
                
                const pdfFiles = files.filter(f => f.name.endsWith('.pdf'));
                if (pdfFiles.length === 0) {
                    listEl.innerHTML = "<li>履歴はまだありません</li>";
                    return;
                }

                listEl.innerHTML = pdfFiles.reverse().map(file => `
                    <li class="history-item">
                        <a href="https://tkrk0412-ctrl.github.io/my-pdf-repo/${file.name}" target="_blank">${decodeURIComponent(file.name)}</a>
                        <small style="color:#999">PDF</small>
                    </li>
                `).join('');
            } catch (e) {
                listEl.innerHTML = "<li>履歴の取得に失敗しました</li>";
            }
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files.length) return alert('ファイルを選んでね');
            const token = prompt("GitHubトークンを入力してください");
            if (!token) return;

            const file = fileInput.files[0];
            const fileName = encodeURIComponent(file.name);
            resultDiv.innerText = '保存中...';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const content = reader.result.split(',')[1];
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Upload ${file.name}`, content: content })
                });

                if (response.ok) {
                    resultDiv.innerHTML = "✅ 保存完了！少し待つと履歴に出ます";
                    setTimeout(loadHistory, 3000); // 3秒後に履歴を再読込
                } else {
                    resultDiv.innerText = 'エラーが発生しました';
                }
            };
        }

        // 初回読み込み
        loadHistory();
    </script>
</body>
</html>
