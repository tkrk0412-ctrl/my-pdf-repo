<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF URL Generator</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 50px; background: #f0f2f5; color: #333; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 90%; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #007bff; }
        input[type="file"] { margin: 20px 0; display: block; width: 100%; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #0056b3; }
        #result { margin-top: 30px; padding: 15px; border-radius: 8px; word-break: break-all; min-height: 50px; }
        .success-box { background: #e7f3ff; border: 1px solid #cce5ff; color: #004085; padding: 10px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF URL発行くん</h1>
        <p>PDFを選んでボタンを押してください</p>
        
        <input type="file" id="fileInput" accept="application/pdf">
        <button onclick="uploadPDF()">アップロード開始</button>

        <div id="result"></div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            
            if (!fileInput.files.length) {
                alert('PDFファイルを選択してください！');
                return;
            }

            // セキュリティ対策：トークンをコードに書かず、入力させる
            const token = prompt("GitHubのトークン（github_pat_...）を入力してください");
            if (!token) return;

            const file = fileInput.files[0];
            const fileName = encodeURIComponent(file.name);
            const repo = "tkrk0412-ctrl/my-pdf-repo"; // あなたのリポジトリ名

            resultDiv.innerText = 'GitHubへ送信中...';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const content = reader.result.split(',')[1];

                try {
                    const response = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: `Upload ${file.name}`,
                            content: content
                        })
                    });

                    if (response.ok) {
                        const url = `https://tkrk0412-ctrl.github.io/my-pdf-repo/${fileName}`;
                        resultDiv.className = 'success-box';
                        resultDiv.innerHTML = `
                            <strong>アップロード成功！</strong><br>
                            <small>URLをコピーして使ってください：</small><br>
                            <a href="${url}" target="_blank">${url}</a>
                        `;
                    } else {
                        const errData = await response.json();
                        resultDiv.innerText = 'エラー: ' + (errData.message || 'アップロードに失敗しました。');
                    }
                } catch (error) {
                    resultDiv.innerText = '通信エラーが発生しました。';
                    console.error(error);
                }
            };
        }
    </script>
</body>
</html>
